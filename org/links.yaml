# Machine-readable link registry for xq-context-hub.
# Clone targets resolve to: <hub>/${checkout_root}/<name>
#
# Active linked checkouts only (not the full org catalogue).
# Each linked repo MUST expose hub-readable context on its default branch:
#   CONSUMER_CONTEXT.md (preferred) | AGENTS.md | AGENT.md
# Audit: ./scripts/audit-consumer-context.sh
#
# Broader org inventory lives in org/catalogue.md — add a repo here only when
# the hub should sync/checkout it under checkouts/.

checkout_root: checkouts

org: chauhaidang
default_host: github.com

repos:
  xq-harness:
    url: git@github.com:chauhaidang/xq-harness.git
    domain: harness
    default_branch: main
  xq-versastack:
    url: git@github.com:chauhaidang/xq-versastack.git
    domain: harness
    default_branch: main
