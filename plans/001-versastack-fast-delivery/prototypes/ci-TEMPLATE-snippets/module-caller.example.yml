# PROTOTYPE — path-filtered caller template (job-level filters + always-green gate).
# Copy to checkouts/xq-versastack/.github/workflows/ci-<module>.yml when a module ships.
# Replace ALL placeholders:
#   __MODULE__  — directory name under modules/ (e.g. hello-cli)
#   __SETUP__   — node | swift | none
#   __RUNNER__  — ubuntu-latest (Node/none) or macos-14 (typical Swift)
#
# IMPORTANT: Do NOT put `paths:` on pull_request if `gate` is a required check.
# Missing workflows = missing required checks. Filter inside `changes` instead.
# Optional: keep `paths:` on push:main only to save minutes when not required.
#
# Do NOT enable a caller in Phase 0 / this wave if no modules/<name>/ exists.
#
name: ci-__MODULE__

on:
  pull_request: {}
  push:
    branches: [main]
    # Optional savings on main; safe because main protection often differs from PR rules.
    paths:
      - "modules/__MODULE__/**"
      - ".github/workflows/ci-__MODULE__.yml"
      - ".github/workflows/module-ci.yml"
  workflow_dispatch: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.filter.outputs.module }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            module:
              - 'modules/__MODULE__/**'
              - '.github/workflows/ci-__MODULE__.yml'
              - '.github/workflows/module-ci.yml'

  verify:
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    uses: ./.github/workflows/module-ci.yml
    with:
      module: __MODULE__
      setup: __SETUP__
      command: ./scripts/ci.sh
      runner: __RUNNER__

  # Branch protection required check (when module exists):
  #   ci-__MODULE__ / gate
  gate:
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce __MODULE__ gate
        run: |
          set -euo pipefail
          if [[ "${{ needs.changes.outputs.run_ci }}" != "true" ]]; then
            echo "No __MODULE__ paths changed — gate green (no-op)"
            exit 0
          fi
          result="${{ needs.verify.result }}"
          echo "verify result=$result"
          if [[ "$result" == "success" ]]; then
            exit 0
          fi
          # skipped/cancelled when if: false should not happen when run_ci=true
          exit 1
